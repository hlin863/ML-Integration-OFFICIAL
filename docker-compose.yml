version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  web:
    build: .
    depends_on:
      - rabbitmq
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,0.0.0.0
    volumes:
      - .:/code
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A mysite worker --loglevel=info
    depends_on:
      - rabbitmq
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    volumes:
      - .:/code
