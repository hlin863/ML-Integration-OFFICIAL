name: Django and Model CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "wine_quality.csv"
      - "data/**"
      - "datasets/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "wine_quality.csv"
      - "data/**"
      - "datasets/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  django-and-model-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: mysite.settings
      CELERY_TASK_ALWAYS_EAGER: "true"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Train wine quality model
        run: python train.py --dataset wine_quality.csv --output-dir artifacts/ci

      - name: Show model metrics
        run: cat artifacts/ci/metrics.txt

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-training-artifacts
          path: |
            artifacts/ci/metrics.txt
            artifacts/ci/feature_importance.png
            artifacts/ci/residuals.png
